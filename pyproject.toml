[project]
name = "ai-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "langchain-core>=1.8.4",
    "langchain-ollama>=1.2.0",
    "langgraph>=1.2.24",
    "ollama>=0.6.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "integration: tests requiring external services or resources",
]
